<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLink - Secure Access</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- LOGIN VIEW (Visible by default) -->
            <div id="login-view">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p>Log in to access your dashboard</p>
                </div>
                
                <form id="login-form" class="auth-form">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <input type="password" id="login-password" placeholder="Password" required>
                    <button type="submit" class="btn-submit">Sign In</button>
                    <div id="login-msg"></div>
                </form>

                <div class="toggle-link">
                    New to MediLink? <a id="show-register">Create an account</a>
                </div>
            </div>

            <!-- REGISTER VIEW (Hidden by default) -->
            <div id="register-view" class="hidden-view">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Join the MediLink network</p>
                </div>

                <form id="register-form" class="auth-form">
                    <input type="text" id="reg-username" placeholder="Choose a Username" required>
                    <input type="password" id="reg-password" placeholder="Choose a Password" required>
                    <select id="reg-role" required>
                        <option value="" disabled selected>Select your role...</option>
                        <option value="patient">Patient</option>
                        <option value="doctor">Medical Professional</option>
                    </select>
                    <button type="submit" class="btn-submit">Register</button>
                    <div id="reg-msg"></div>
                </form>

                <div class="toggle-link">
                    Already have an account? <a id="show-login">Sign in</a>
                </div>
            </div>

        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
