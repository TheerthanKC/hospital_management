<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLink - Doctor Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- The JavaScript injects the navbar here -->
    <div id="navbar-container"></div>

    <main>
        <!-- NEW: Appointments Card -->
        <div class="dashboard-card">
            <h2>Upcoming Appointments</h2>
            <p>View scheduled patient appointments below.</p>
            <div id="appointment-list" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">Loading appointments...</p>
            </div>
        </div>

        <!-- EXISTING: Patient Records Card -->
        <div class="dashboard-card">
            <h2>Patient Records Database</h2>
            <p>Welcome. Here you can view the master list of patient medical records.</p>
            <div id="all-records-list" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">No records found in the database yet.</p>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
