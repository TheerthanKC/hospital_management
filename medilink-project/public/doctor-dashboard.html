<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediLink - Doctor Dashboard</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <!-- The JavaScript injects the navbar here -->
    <div id="navbar-container"></div>

    <main>
        <!-- Appointments Card -->
        <div class="dashboard-card">
            <h2>Upcoming Appointments</h2>
            <div id="appointment-list" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">Loading appointments...</p>
            </div>
        </div>

        <!-- Patient Appointment History Card -->
        <div class="dashboard-card">
            <h2>Patient Appointment History</h2>
            <div id="appointment-history-list" style="margin-top: 20px;">
                <p style="color: var(--text-muted);">No records found in the database yet.</p>
            </div>
        </div>
    </main>

    <script src="js/app.js?v=2"></script>
</body>
</html>
